name: CI

# Lint, type-check/build and test on every PR and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (package.json engines: >=20.15) and current LTS.
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` = `tsc && gulp build:icons` — this is also our type-check
      # (ts-jest runs with diagnostics off, so tsc is what catches type errors).
      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci
