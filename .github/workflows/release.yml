name: Release

# Publish to npm when a GitHub Release is published.
# Flow: bump the version in package.json → create a GitHub Release whose tag is
# `v<version>` (e.g. v0.2.0) → this workflow verifies + publishes.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 20 ships npm 10.x.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        # --ignore-scripts skips compiling n8n-workflow's native transitive dep
        # (isolated-vm), which isn't needed to build/lint/test/publish this package.
        run: npm ci --ignore-scripts

      # Guard against publishing a package whose version doesn't match the tag.
      - name: Verify package version matches the release tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json = $PKG_VERSION | release tag = $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION). Bump package.json and re-tag."
            exit 1
          fi

      # Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN needed. npm
      # exchanges the GitHub Actions id-token for a short-lived registry token and
      # attaches a signed provenance attestation automatically (required for n8n
      # community-node verification). Configure the trusted publisher first at
      # npmjs.com → the package → Settings → Trusted Publisher → GitHub Actions
      # (repo mortocks/n8n-nodes-apple-appstore, workflow release.yml).
      # `npm publish` runs `prepublishOnly` (build && lint && test) as the gate.
      - name: Publish
        run: npm publish --provenance --access public
