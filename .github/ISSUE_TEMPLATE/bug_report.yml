name: Bug report
description: Something in the App Store Connect nodes isn't working as expected
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please don't include API keys, `.p8` private keys, or webhook secrets.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: On "Beta Group → Get Many" with a Target App set, I expected …
    validations:
      required: true
  - type: input
    id: node-operation
    attributes:
      label: Node / resource / operation
      placeholder: e.g. App Store Connect → Customer Review → Create Response
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package version, n8n version, Node.js version
      placeholder: e.g. n8n-nodes-apple-appstore 0.1.0, n8n 2.31.4, Node 20.15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error output
      description: The node error message and any n8n logs (redact secrets).
      render: shell
