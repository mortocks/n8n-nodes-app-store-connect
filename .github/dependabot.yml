version: 2
updates:
  # npm dependencies (mostly devDependencies — this package ships no runtime deps).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      # Batch routine dev-dependency bumps into one PR to reduce noise.
      dev-dependencies:
        dependency-type: development
    # These majors are intentionally pinned for n8n toolchain compatibility
    # (eslint plugin needs eslint 8; ts-jest needs jest 29; @types/node tracks
    # the engines floor). Skip major bumps so Dependabot stops re-proposing them;
    # minor/patch still flow.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/parser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions in these workflows up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, ci]
